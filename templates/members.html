{% extends "base.html" %}
{% block content %}
  <h2>Members</h2>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Status</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for member in members %}
        <tr>
          <td>{{ member.name }}</td>
          <td>{{ 'Has a duck on loan' if member.has_active_loan else '' }}</td>
          <td>
            <form class="inline" method="post" action="{{ url_for('delete_member', member_id=member.member_id) }}"
                  onsubmit="return confirm('Remove {{ member.name }}?');">
              <button type="submit" {{ 'disabled' if member.has_active_loan else '' }}>Remove</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3">No members yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <h3>Add a member</h3>
  <form method="post" action="{{ url_for('members') }}">
    <label for="name">Name</label><br>
    <input id="name" name="name" type="text" required>
    <button type="submit">Add</button>
  </form>
{% endblock %}
