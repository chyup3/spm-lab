<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Duck Lending Library</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 2rem auto; color: #222; }
    h1 { margin-bottom: 0; }
    .subtitle { color: #666; margin-top: 0.25rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .status-available { color: #2a7d2a; }
    .status-out { color: #333; }
    .status-overdue { color: #b30000; font-weight: bold; }
    .flash { background: #eef; border: 1px solid #99c; padding: 0.5rem 1rem; margin-top: 1rem; }
    nav a { margin-right: 1rem; }
    form.inline { display: inline; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>🦆 Duck Lending Library</h1>
  <p class="subtitle">Campus makerspace debugging duck loans</p>
  <nav>
    <a href="{{ url_for('index') }}">Dashboard</a>
    <a href="{{ url_for('borrow') }}">Borrow a duck</a>
    <a href="{{ url_for('members') }}">Members</a>
  </nav>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
