{% extends "base.html" %}
{% block content %}
  <h2>Borrow a duck</h2>
  {% if ducks %}
    <form method="post" action="{{ url_for('borrow') }}">
      <label for="member_id">Member</label><br>
      <select id="member_id" name="member_id" required>
        {% for member in members %}
          <option value="{{ member.member_id }}">{{ member.name }}</option>
        {% endfor %}
      </select>
      <br><br>
      <label for="duck_id">Duck</label><br>
      <select id="duck_id" name="duck_id" required>
        {% for duck in ducks %}
          <option value="{{ duck.duck_id }}">Duck {{ duck.duck_id }}</option>
        {% endfor %}
      </select>
      <br><br>
      <button type="submit">Borrow (due back in 7 days)</button>
    </form>
  {% else %}
    <p>No ducks are currently available.</p>
  {% endif %}
{% endblock %}
